# Databricks Asset Bundle — whole-wheat blog demo
bundle:
  name: whole-wheat

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name
    default: workspace
  volume:
    description: Volume name for corpus JSON files
    default: corpus
  hf_token:
    description: Hugging Face token. Pass at deploy with --var hf_token=... Do not put the real value in YAML.

sync:
  include:
    - src/**
    - data/**
    - notebooks/**
  exclude:
    - .agents/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b9d925fd-a82e.cloud.databricks.com

resources:
  schemas:
    whole_wheat:
      name: whole_wheat
      catalog_name: ${var.catalog}
      comment: whole-wheat page rows and corpus files

  volumes:
    corpus:
      name: ${var.volume}
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.whole_wheat.name}
      volume_type: MANAGED
      comment: OfficeQA JSON corpus files

  jobs:
    ingest:
      name: whole-wheat-ingest
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: notebooks/01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.whole_wheat.name}
              volume: ${resources.volumes.corpus.name}
