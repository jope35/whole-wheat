[project]
name = "whole-wheat"
version = "0.1.0"
description = "Toast-1-style search subagent demo"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "datasets",
    "fastembed",
    "langchain",
    "langchain-openai",
    "langgraph",
    "mlflow",
    "sqlite-vec",
]

[project.scripts]
whole-wheat = "whole_wheat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whole_wheat"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
