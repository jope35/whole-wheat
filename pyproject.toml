[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whole-wheat"
version = "0.1.0"
description = "Blog demo: Databricks search subagent"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/whole_wheat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
