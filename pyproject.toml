[project]
name = "whole-wheat"
version = "0.1.0"
description = "Toast-1-style search subagent (blog demo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed",
    "huggingface_hub",
    "sqlite-vec",
    "tenacity",
]

[project.scripts]
whole-wheat = "whole_wheat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whole_wheat"]
